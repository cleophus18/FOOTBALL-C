<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b111b">
    <title>Touchline — Club Logo Catalog</title>
    <style>
      :root { color-scheme: dark; font-family: "Segoe UI", sans-serif; background: #0b111b; color: #edf4ff; }
      * { box-sizing: border-box; }
      body { max-width: 1240px; margin: 0 auto; padding: 36px 22px 60px; }
      header { padding-bottom: 22px; border-bottom: 1px solid #26364b; }
      h1 { margin: 5px 0 8px; font-size: clamp(26px, 5vw, 42px); }
      p { max-width: 720px; color: #9aacc2; line-height: 1.6; }
      .eyebrow { color: #70bbff; font: 11px Consolas, monospace; letter-spacing: .14em; }
      section { margin-top: 28px; }
      h2 { padding-bottom: 10px; border-bottom: 1px solid #26364b; font-size: 20px; }
      .teams { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
      article { min-height: 112px; display: flex; align-items: center; gap: 13px; padding: 14px; border: 1px solid #26364b; border-radius: 8px; background: #101a29; }
      article svg, article img { flex: 0 0 48px; width: 48px; height: 52px; object-fit: contain; }
      article b { font-size: 12px; line-height: 1.4; }
      .loading, .error { padding: 22px; color: #9aacc2; }
      .error { color: #ff9d91; }
      .note { margin-top: 10px; font-size: 12px; color: #7c8c9a; }
    </style>
  </head>
  <body>
    <header>
      <div class="eyebrow">TOUCHLINE · REAL CLUB LOGOS · <span id="crest-count">96</span> CLUBS</div>
      <h1>Club logo catalog</h1>
      <p>Real club crests with transparent backgrounds for the five major European leagues. Logos are loaded from <code>assets/logos/</code> and grouped by league. Clubs without a matched logo fall back to the generated crest.</p>
    </header>
    <main id="catalog"><div class="loading">Loading club logos…</div></main>
    <script type="module">
      import { renderClubCrest } from "../../src/ui/club-crests.mjs";

      const catalog = document.querySelector("#catalog");
      const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (character) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      })[character]);
      try {
        const response = await fetch("../config/career-league-teams.json");
        if (!response.ok) throw new Error(`Could not load team list (${response.status}).`);
        const teams = await response.json();
        const leagueNames = Object.keys(teams);
        document.querySelector("#crest-count").textContent = String(
          leagueNames.reduce((count, league) => count + (teams[league] ?? []).length, 0),
        );
        catalog.innerHTML = leagueNames.map((league) => `
          <section>
            <h2>${escapeHtml(league)} <span class="eyebrow">${(teams[league] ?? []).length} TEAMS</span></h2>
            <div class="teams">${(teams[league] ?? []).map((name) => `
              <article>${renderClubCrest(name)}<b>${escapeHtml(name)}</b></article>
            `).join("")}</div>
            <p class="note">Logos: <code>assets/logos/${league.toLowerCase().replace(" ", "-")}/</code> &middot; Fallback: generated crest</p>
          </section>
        `).join("");
      } catch (error) {
        catalog.innerHTML = `<p class="error">${error.message}</p>`;
      }
    </script>
  </body>
</html>
